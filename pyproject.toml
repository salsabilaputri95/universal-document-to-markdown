[project]
name = "omnimark"
version = "1.0.0"
description = "OmniMark — Local-First Universal Document to Markdown Converter"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
